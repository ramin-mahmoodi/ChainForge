<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9eef2" />
    <meta name="description" content="Build multi-hop V2Ray and Xray proxy chains in your browser. Paste your server links, get one config.json. Nothing is uploaded." />
    <title>ChainForge — V2Ray &amp; Xray Chain Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500;600&family=Vazirmatn:wght@400;500;600;700;800&display=swap"
    />
    <script>
      // Apply saved/system theme before first paint to avoid a flash
      try {
        var t = null;
        try { t = localStorage.getItem("chainforge-theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
        var l = null;
        try { l = localStorage.getItem("chainforge-lang"); } catch (e) {}
        if (l !== "fa" && l !== "en") l = (navigator.language || "").toLowerCase().indexOf("fa") === 0 ? "fa" : "en";
        document.documentElement.setAttribute("lang", l);
        document.documentElement.setAttribute("dir", l === "fa" ? "rtl" : "ltr");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
